services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pasantias
      POSTGRES_PASSWORD: pasantias
      POSTGRES_DB: pasantias_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pasantias -d pasantias_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-solo-desarrollo}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://pasantias:pasantias@db:5432/pasantias_dev
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
